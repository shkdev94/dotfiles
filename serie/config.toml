# serie — git commit graph TUI. https://lusingander.github.io/serie/

# `d` on a commit: show its diff against the first parent in an inline view.
[core.user_command]
commands_1 = { name = "git diff", commands = ["git", "--no-pager", "diff", "--color=always", "{{first_parent_hash}}", "{{target_hash}}"] }

[keybind]
user_command_1 = ["d"]
