# Prefix: Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Clipboard: pipe tmux copy buffer to macOS clipboard
set -s copy-command "pbcopy"

# Mouse support
set -g mouse on

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Scrollback buffer
set -g history-limit 10000

# Reduce escape delay (important for nvim)
set -sg escape-time 10

# Focus events (needed for nvim autoread)
set -g focus-events on

# Let image protocols (kitty/iTerm) through to the terminal for snacks image
set -g allow-passthrough on

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# One Dark theme
set -g status-position top
set -g status-interval 10
set -g status-style "bg=#282c34,fg=#abb2bf"
set -g status-left "#[bg=#98c379,fg=#282c34,bold] #S #[bg=#282c34] "
set -g status-right '#(~/.config/tmux/bin/status-metrics)'
set -g status-left-length 60
set -g status-right-length 100
set -g window-status-format "#[fg=#565c64] #I:#W "
set -g window-status-current-format "#[fg=#61afef,bold] #I:#W "
set -g pane-border-style "fg=#3e4452"
set -g pane-active-border-style "fg=#61afef"
set -g message-style "bg=#282c34,fg=#abb2bf"

# Workspace: toggle the persistent sidebar; Tab switches tabs inside it.
bind Space run-shell -b "~/.config/tmux/bin/workspace-sidebar toggle #{q:client_name}"
unbind a
set-hook -g client-session-changed[40] 'run-shell -b "~/.config/tmux/bin/workspace-sidebar follow #{q:hook_client}"'
set-hook -g session-window-changed[40] 'run-shell -b "~/.config/tmux/bin/workspace-sidebar follow"'
set-hook -g client-detached[40] 'run-shell -b "~/.config/tmux/bin/workspace-sidebar close #{q:hook_client}"'
